services:
  - type: web
    name: release-radar-bot
    env: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: APP_URL
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: PORT
        value: "3000"

